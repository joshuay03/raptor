<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1008" viewBox="0 0 1320 1008" role="img" aria-labelledby="title description">
  <title id="title">Raptor startup output</title>
  <desc id="description">The complete startup example from the README, including every log prefix, the process tree, and all ten worker boot messages. Long lines wrap as they would in a terminal.</desc>
  <rect x="1" y="1" width="1318" height="1006" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <path d="M1 60H1319" stroke="#30363d" stroke-width="2"/>
  <circle cx="32" cy="30" r="8" fill="#ff5f57"/>
  <circle cx="60" cy="30" r="8" fill="#febc2e"/>
  <circle cx="88" cy="30" r="8" fill="#28c840"/>
  <text x="660" y="37" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">raptor</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#e6edf3" xml:space="preserve">
    <text x="32" y="110">&gt; bundle exec raptor -w 10 -t 3 hello_world.ru</text>
    <text x="32" y="146">[Raptor 39704|Main|Main] Cluster initializing:</text>
    <text x="32" y="182">[Raptor 39704|Main|Main] ├─ Version: 0.23.0</text>
    <text x="32" y="218">[Raptor 39704|Main|Main] ├─ Ruby Version: ruby 4.0.9 (2026-10-23 revision 3e93b23afc) </text>
    <text x="32" y="254">+YJIT +PRISM [arm64-darwin25]</text>
    <text x="32" y="290">[Raptor 39704|Main|Main] ├─ Environment: development</text>
    <text x="32" y="326">[Raptor 39704|Main|Main] ├─ Master PID: 39704</text>
    <text x="32" y="362">[Raptor 39704|Main|Main] │  └─ 10 worker processes</text>
    <text x="32" y="398">[Raptor 39704|Main|Main] │     ├─ 1 server thread</text>
    <text x="32" y="434">[Raptor 39704|Main|Main] │     ├─ 1 reactor thread</text>
    <text x="32" y="470">[Raptor 39704|Main|Main] │     ├─ 1 HTTP/1.1 pipeline ractor</text>
    <text x="32" y="506">[Raptor 39704|Main|Main] │     ├─ 1 pipeline collector thread</text>
    <text x="32" y="542">[Raptor 39704|Main|Main] │     ├─ 3 worker threads (scaling, no limit)</text>
    <text x="32" y="578">[Raptor 39704|Main|Main] │     └─ 1 stats thread</text>
    <text x="32" y="614">[Raptor 39704|Main|Main] └─ Listening on 0.0.0.0:9292</text>
    <text x="32" y="650">[Raptor 39720|Main|Main] Worker 1 booted</text>
    <text x="32" y="686">[Raptor 39719|Main|Main] Worker 0 booted</text>
    <text x="32" y="722">[Raptor 39722|Main|Main] Worker 3 booted</text>
    <text x="32" y="758">[Raptor 39721|Main|Main] Worker 2 booted</text>
    <text x="32" y="794">[Raptor 39723|Main|Main] Worker 4 booted</text>
    <text x="32" y="830">[Raptor 39725|Main|Main] Worker 6 booted</text>
    <text x="32" y="866">[Raptor 39724|Main|Main] Worker 5 booted</text>
    <text x="32" y="902">[Raptor 39728|Main|Main] Worker 8 booted</text>
    <text x="32" y="938">[Raptor 39726|Main|Main] Worker 7 booted</text>
